services:
  - type: web
    name: behesab-miniapp
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: behesab-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "false"

databases:
  - name: behesab-db
    plan: free
    region: frankfurt
    databaseName: behesab
    user: behesab
